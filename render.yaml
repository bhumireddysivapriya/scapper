services:
  - type: web
    name: book-scraper-assignment
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: book-scraper-db
          property: connectionString
databases:
  - name: book-scraper-db
    databaseName: books
    user: books_user
    plan: free
